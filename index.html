<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌺 彼岸花抽獎系統</title>
    <style>
        :root {
            --primary: #ff2a44;
            --primary-glow: rgba(255, 42, 68, 0.4);
            --bg-gradient: radial-gradient(circle at 50% 10%, #1a0f12 0%, #08090c 80%);
            --card-bg: rgba(20, 24, 33, 0.85);
            --border: #282f3d;
            --text-main: #f5f7fa;
            --text-muted: #74839b;
        }

        body {
            font-family: 'PingFang TC', 'SF Pro Display', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-layout {
            display: flex;
            width: 100%;
            max-width: 1260px;
            gap: 30px;
            align-items: stretch;
        }

        .card {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            box-sizing: border-box;
            position: relative;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #ff6699, var(--primary));
            background-size: 200% auto;
            animation: flowingGlow 4s linear infinite;
        }

        @keyframes flowingGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .left-panel { flex: 1.6; }
        .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        h2 {
            color: #ffffff;
            margin-top: 0;
            text-align: center;
            font-size: 28px;
            letter-spacing: 4px;
            font-weight: 800;
            text-shadow: 0 0 20px var(--primary-glow);
        }
        h2 span { color: var(--primary); }

        h3 {
            color: #ffffff;
            margin-top: 0;
            font-size: 22px;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            color: #e2e8f0;
            font-size: 15px;
        }

        textarea, input {
            width: 100%;
            background: #0f121a;
            color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.25s ease;
        }
        textarea:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
            background: #131722;
        }
        textarea { height: 120px; resize: vertical; }

        .prize-input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }

        .btn-add {
            background: #1c2230;
            color: #ffffff;
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-add:hover { background: #262e42; border-color: #3f4e6e; }
        .btn-del { background: none; border: none; color: #ff4d66; cursor: pointer; font-size: 20px; padding: 5px; }

        .prize-cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 12px;
        }

        .prize-badge-card {
            background: #0f121a;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 110px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .prize-badge-card .p-name { font-size: 16px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px; }
        .prize-badge-card .p-qty { font-size: 13px; color: var(--text-muted); }

        .prize-badge-card.active {
            border-color: var(--primary);
            background: rgba(255, 42, 68, 0.06);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-3px);
        }
        .prize-badge-card.active .p-name { color: #ffffff; }
        .prize-badge-card.active .p-qty { color: #ff8899; font-weight: bold; }

        .prize-badge-card.soldout { opacity: 0.15; cursor: not-allowed; pointer-events: none; }

        .draw-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #b31225 100%);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 22px;
            font-weight: 800;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(255, 42, 68, 0.3);
            letter-spacing: 6px;
        }
        .draw-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 42, 68, 0.45); }
        .draw-btn:disabled { background: #202633; color: var(--text-muted); box-shadow: none; cursor: not-allowed; transform: none; }

        .stage-container {
            margin: 30px 0 10px 0;
            padding: 30px;
            background: #090a0d;
            border-radius: 14px;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #282f3d;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
        }

        #resultText {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        .rolling { color: var(--primary) !important; text-shadow: 0 0 25px var(--primary) !important; }
        .roll-done { animation: stagePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes stagePop {
            0% { transform: scale(0.7); filter: brightness(2); }
            100% { transform: scale(1); color: #ffffff; text-shadow: 0 0 25px var(--primary), 0 0 10px rgba(255,255,255,0.5); }
        }

        .info-text { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

        .history-list {
            padding-left: 0;
            list-style: none;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #262e3d; border-radius: 10px; }
        .history-list::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .history-list li {
            padding: 14px;
            border-bottom: 1px solid #1c2230;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeInRow 0.35s ease-out;
        }
        @keyframes fadeInRow {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .history-list li span.prize-tag {
            background: linear-gradient(90deg, rgba(255,42,68,0.15), rgba(255,42,68,0.02));
            color: #ff556b;
            border: 1px solid rgba(255,42,68,0.3);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        .history-list li span.winner-name { font-weight: 700; color: #ffffff; font-size: 17px; }
        
        .btn-clear-cache { background: none; border: 1px solid #333947; color: var(--text-muted); font-size: 12px; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .btn-clear-cache:hover { background: #1c2230; color: #ff4d66; }
    </style>
</head>
<body>

<div class="main-layout">
    
    <div class="card left-panel">
        <h2>🌺 <span>彼岸花</span> 抽獎系統</h2>
        
        <div class="form-group">
            <label>👥 抽獎名單列表（一人一行）：</label>
            <textarea id="namesInput" placeholder="請在此輸入名單..." oninput="handleNameInputDebounce()"></textarea>
            <div class="info-text" id="poolCount">目前名單人數：0 人</div>
        </div>

        <div class="form-group">
            <label>🎁 獎項與數量設定：</label>
            <div id="prizeSetupContainer"></div>
            <button class="btn-add" onclick="addPrizeRow('', 1)">＋ 增加新獎項</button>
        </div>

        <div class="form-group">
            <label>🎯 當前欲抽取獎項（請點擊下方字卡選擇）：</label>
            <div class="prize-cards-container" id="prizeCardsBoard"></div>
        </div>

        <button id="drawBtn" class="draw-btn" onclick="startPerfectDraw()">✨ 開始抽獎 ✨</button>
        
        <div class="stage-container">
            <div id="resultText">READY</div>
        </div>
    </div>

    <div class="card right-panel">
        <h3>
            <span>🏆 中獎名單紀錄</span>
            <button class="btn-clear-cache" onclick="resetAllStorage()">重設全系統</button>
        </h3>
        <ul class="history-list" id="historyList"></ul>
    </div>

</div>

<script>
let prizeInventory = {};
let selectedPrizeName = "";
let historyData = [];
let nameInputTimeout;

function loadFromCache() {
    try {
        const cachedNames = localStorage.getItem('bh_names') || "";
        const cachedPrizes = JSON.parse(localStorage.getItem('bh_prizes')) || [];
        const cachedHistory = JSON.parse(localStorage.getItem('bh_history')) || [];
        selectedPrizeName = localStorage.getItem('bh_selected') || "";

        document.getElementById('namesInput').value = cachedNames;

        const container = document.getElementById('prizeSetupContainer');
        container.innerHTML = "";
        
        if (cachedPrizes.length === 0) {
            addPrizeRow("", 1);
        } else {
            cachedPrizes.forEach(p => addPrizeRow(p.name, p.qty));
        }

        historyData = cachedHistory;
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = "";
        historyData.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span class="prize-tag">${item.prize}</span><span class="winner-name">${item.winner}</span>`;
            historyList.appendChild(li);
        });
    } catch (e) {
        addPrizeRow("", 1);
    }
}

function saveToCache() {
    localStorage.setItem('bh_names', document.getElementById('namesInput').value);
    const rows = document.querySelectorAll('.prize-input-row');
    let prizeArr = [];
    rows.forEach(row => {
        const name = row.querySelector('.prize-name').value.trim();
        const qty = parseInt(row.querySelector('.prize-qty').value) || 0;
        if (name) prizeArr.push({ name, qty });
    });
    localStorage.setItem('bh_prizes', JSON.stringify(prizeArr));
    localStorage.setItem('bh_history', JSON.stringify(historyData));
    localStorage.setItem('bh_selected', selectedPrizeName);
}

function handleNameInputDebounce() {
    clearTimeout(nameInputTimeout);
    const textarea = document.getElementById('namesInput');
    const rawNames = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== "");
    document.getElementById('poolCount').innerText = `目前名單人數：${rawNames.length} 人 (正在輸入...)`;

    nameInputTimeout = setTimeout(() => {
        cleanAndDuplicateCheck();
    }, 400);
}

function cleanAndDuplicateCheck() {
    const textarea = document.getElementById('namesInput');
    const rawNames = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== "");
    
    let uniqueNames = [];
    let duplicates = [];
    
    rawNames.forEach(name => {
        if (uniqueNames.includes(name)) {
            if (!duplicates.includes(name)) duplicates.push(name);
        } else {
            uniqueNames.push(name);
        }
    });
    
    if (duplicates.length > 0) {
        alert(`【⚠️ 偵測到重複名單】\n以下人員重複，已自動過濾：\n👉 ${duplicates.join('、')}`);
    }
    
    textarea.value = uniqueNames.join('\n');
    document.getElementById('poolCount').innerText = `目前名單人數：${uniqueNames.length} 人`;
    saveToCache();
    return uniqueNames;
}

function autoSyncPrizeCards() {
    const names = document.querySelectorAll('.prize-name');
    const qtys = document.querySelectorAll('.prize-qty');
    const board = document.getElementById('prizeCardsBoard');
    
    board.innerHTML = '';
    prizeInventory = {};
    
    let tempInventory = {};
    let duplicatePrizesDetected = [];

    names.forEach((node, index) => {
        const pName = node.value.trim();
        const pQty = parseInt(qtys[index].value) || 0;
        
        if (pName !== "") {
            if (tempInventory[pName] !== undefined) {
                tempInventory[pName] += pQty;
                if (!duplicatePrizesDetected.includes(pName)) {
                    duplicatePrizesDetected.push(pName);
                }
            } else {
                tempInventory[pName] = pQty;
            }
        }
    });

    if (duplicatePrizesDetected.length > 0) {
        alert(`【🎁 獎項重複合併提示】\n偵測到重複的獎項名稱：${duplicatePrizesDetected.join('、')}\n系統已自動為您將數量相加並融合成單一字卡。`);
        const container = document.getElementById('prizeSetupContainer');
        container.innerHTML = "";
        for (let name in tempInventory) {
            addPrizeRowWithoutSync(name, tempInventory[name]);
        }
    }

    prizeInventory = tempInventory;
    for (let pName in prizeInventory) {
        const card = document.createElement('div');
        card.className = 'prize-badge-card';
        
        if (prizeInventory[pName] <= 0) {
            card.className += ' soldout';
        } else if (pName === selectedPrizeName) {
            card.className += ' active';
        }

        card.innerHTML = `
            <span class="p-name">${pName}</span>
            <span class="p-qty">剩餘 ${prizeInventory[pName]} 個</span>
        `;
        
        card.onclick = function() {
            if (prizeInventory[pName] > 0) selectPrizeCard(pName);
        };
        board.appendChild(card);
    }

    if (selectedPrizeName && (!prizeInventory[selectedPrizeName] || prizeInventory[selectedPrizeName] <= 0)) {
        selectedPrizeName = "";
        const cards = document.querySelectorAll('.prize-badge-card');
        cards.forEach(c => c.classList.remove('active'));
    }
    saveToCache();
}

function selectPrizeCard(prizeName) {
    selectedPrizeName = prizeName;
    const cards = document.querySelectorAll('.prize-badge-card');
    cards.forEach(card => {
        if (card.querySelector('.p-name').innerText === prizeName) {
            card.classList.add('active');
        } else {
            card.classList.remove('active');
        }
    });
    saveToCache();
}

function addPrizeRow(name = "", qty = 1) {
    addPrizeRowWithoutSync(name, qty);
    autoSyncPrizeCards();
}

function addPrizeRowWithoutSync(name = "", qty = 1) {
    const container = document.getElementById('prizeSetupContainer');
    const row = document.createElement('div');
    row.className = 'prize-input-row';
    row.innerHTML = `
        <input type="text" class="prize-name" placeholder="獎項名稱" style="flex: 3;" value="${name}" oninput="autoSyncPrizeCards()">
        <input type="number" class="prize-qty" placeholder="數量" style="flex: 1;" min="0" value="${qty}" oninput="autoSyncPrizeCards()">
        <button class="btn-del" onclick="removePrizeRow(this)">❌</button>
    `;
    container.appendChild(row);
}

function removePrizeRow(btn) {
    const rows = document.querySelectorAll('.prize-input-row');
    if (rows.length === 1) {
        alert("請至少保留一個獎項設定欄位！");
        return;
    }
    btn.parentElement.remove();
    autoSyncPrizeCards();
}

function startPerfectDraw() {
    const textarea = document.getElementById('namesInput');
    const drawBtn = document.getElementById('drawBtn');
    const resultText = document.getElementById('resultText');
    
    const currentPool = cleanAndDuplicateCheck();
    
    if (currentPool.length === 0) {
        alert("抽獎名單是空的，請先輸入名單！");
        return;
    }
    if (!selectedPrizeName) {
        alert("⚠️ 請先在下方點選一個要抽取的發光獎項字卡！");
        return;
    }
    
    const realWinnerIndex = Math.floor(Math.random() * currentPool.length);
    const realWinner = currentPool[realWinnerIndex];

    drawBtn.disabled = true;
    resultText.className = "rolling";
    
    let counter = 0;
    const totalRolls = 32;
    let currentSpeed = 45;

    function runSmoothAnimation() {
        counter++;

        if (counter < totalRolls - 3) {
            let tempIndex = Math.floor(Math.random() * currentPool.length);
            resultText.innerText = currentPool[tempIndex];
            setTimeout(runSmoothAnimation, currentSpeed);
        } 
        else if (counter === totalRolls - 3) {
            let fakeList = currentPool.filter(n => n !== realWinner);
            resultText.innerText = fakeList.length > 0 ? fakeList[Math.floor(Math.random() * fakeList.length)] : realWinner;
            setTimeout(runSmoothAnimation, currentSpeed + 80);
        }
        else if (counter === totalRolls - 2) {
            let fakeList = currentPool.filter(n => n !== realWinner);
            resultText.innerText = fakeList.length > 0 ? fakeList[Math.floor(Math.random() * fakeList.length)] : realWinner;
            setTimeout(runSmoothAnimation, currentSpeed + 200);
        }
        else if (counter === totalRolls - 1) {
            let fakeList = currentPool.filter(n => n !== realWinner);
            resultText.innerText = fakeList.length > 0 ? fakeList[Math.floor(Math.random() * fakeList.length)] : realWinner;
            setTimeout(runSmoothAnimation, currentSpeed + 450);
        }
        else {
            finalizeWinner(currentPool, realWinnerIndex, realWinner);
        }
    }
    
    runSmoothAnimation();
}

function finalizeWinner(currentPool, winnerIndex, winner) {
    const textarea = document.getElementById('namesInput');
    const drawBtn = document.getElementById('drawBtn');
    const resultText = document.getElementById('resultText');
    const targetPrize = selectedPrizeName;
    
    prizeInventory[targetPrize]--;
    const rows = document.querySelectorAll('.prize-input-row');
    rows.forEach(row => {
        const nameInput = row.querySelector('.prize-name');
        const qtyInput = row.querySelector('.prize-qty');
        if (nameInput.value.trim() === targetPrize) {
            qtyInput.value = prizeInventory[targetPrize];
        }
    });
    
    currentPool.splice(winnerIndex, 1);
    textarea.value = currentPool.join('\n');
    document.getElementById('poolCount').innerText = `目前名單人數：${currentPool.length} 人`;
    
    resultText.className = "roll-done";
    resultText.innerHTML = `🎉 中獎：${winner}`;
    
    const newRecord = { prize: targetPrize, winner: winner };
    historyData.unshift(newRecord);
    
    const historyList = document.getElementById('historyList');
    const li = document.createElement('li');
    li.innerHTML = `<span class="prize-tag">${targetPrize}</span><span class="winner-name">${winner}</span>`;
    historyList.insertBefore(li, historyList.firstChild);
    
    if (prizeInventory[targetPrize] <= 0) {
        selectedPrizeName = "";
    }
    
    autoSyncPrizeCards();
    drawBtn.disabled = false;
}

function resetAllStorage() {
    if (confirm("⚠️ 確定要清除所有快取資料嗎？名單與紀錄將無法恢復。")) {
        localStorage.clear();
        location.reload();
    }
}

window.onload = function() {
    loadFromCache();
    cleanAndDuplicateCheck();
    autoSyncPrizeCards();
};
</script>

</body>
</html>
