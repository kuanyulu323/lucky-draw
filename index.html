<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌺 彼岸花抽獎系統</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #fcf8f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* 左右雙欄佈局 */
        .main-layout {
            display: flex;
            width: 100%;
            max-width: 1100px;
            gap: 20px;
        }
        /* 左欄與右欄的共同基礎樣式 */
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(219, 68, 85, 0.1);
            border-top: 5px solid #db4455; /* 彼岸花紅 */
            box-sizing: border-box;
        }
        .left-panel {
            flex: 1.5;
        }
        .right-panel {
            flex: 1;
            min-height: 500px;
        }
        h2 {
            color: #db4455;
            margin-top: 0;
            text-align: center;
        }
        h3 {
            color: #444;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            resize: vertical;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        /* 獎項設定區域 */
        .prize-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }
        .prize-input-row input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-add {
            background-color: #666;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        /* 抽獎大按鈕 */
        .draw-btn {
            background-color: #db4455;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(219, 68, 85, 0.2);
        }
        .draw-btn:hover {
            background-color: #c33343;
        }
        .draw-btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }
        /* 結果顯示區 */
        #result {
            margin: 20px 0;
            padding: 15px;
            background: #fff5f5;
            border-radius: 6px;
            font-size: 26px;
            font-weight: bold;
            color: #db4455;
            min-height: 40px;
            text-align: center;
            border: 1px dashed #db4455;
        }
        .info-text {
            font-size: 13px;
            color: #777;
            margin-top: 3px;
        }
        /* 右欄中獎名單列表 */
        .history-list {
            padding-left: 0;
            list-style: none;
        }
        .history-list li {
            padding: 10px;
            border-bottom: 1px dashed #eee;
            color: #333;
            font-size: 15px;
        }
        .history-list li span.prize-tag {
            background: #db4455;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 8px;
        }
        .history-list li span.winner-name {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="main-layout">
    
    <!-- 左欄：控制與抽獎面板 -->
    <div class="card left-panel">
        <h2>🌺 彼岸花抽獎系統</h2>
        
        <!-- 1. 抽獎名單輸入（隨時可調整） -->
        <div class="form-group">
            <label>👥 抽獎名單（一人一行，輸入時會自動去重）：</label>
            <textarea id="namesInput" placeholder="小明&#10;小華&#10;小白" onblur="validateAndCleanNames()"></textarea>
            <div class="info-text" id="poolCount">目前名單人數：0 人</div>
        </div>

        <!-- 2. 獎項自訂區域 -->
        <div class="form-group">
            <label>🎁 獎項清單設定：</label>
            <div id="prizeSetupContainer">
                <div class="prize-input-row">
                    <input type="text" class="prize-name" placeholder="例如：頭獎 iPhone" style="flex: 2;" value="頭獎 iPhone">
                    <input type="number" class="prize-qty" placeholder="數量" style="flex: 1;" min="1" value="1">
                </div>
                <div class="prize-input-row">
                    <input type="text" class="prize-name" placeholder="例如：二獎 現金千元" style="flex: 2;" value="二獎 現金千元">
                    <input type="number" class="prize-qty" placeholder="數量" style="flex: 1;" min="1" value="3">
                </div>
            </div>
            <button class="btn-add" onclick="addPrizeRow()">＋增加獎項欄位</button>
        </div>

        <!-- 3. 目前要抽的獎項選擇 -->
        <div class="form-group">
            <label>🎯 當前欲抽取獎項：</label>
            <button class="btn-add" style="float: right; margin-bottom: 5px;" onclick="refreshPrizeSelect()">🔄 更新/鎖定獎項選單</button>
            <select id="prizeSelect">
                <option value="">-- 請先點選上方按鈕更新獎項 --</option>
            </select>
        </div>

        <button id="drawBtn" class="draw-btn" onclick="startDraw()">✨ 開始抽獎 ✨</button>
        
        <div id="result">準備抽獎...</div>
    </div>

    <!-- 右欄：中獎名單紀錄 -->
    <div class="card right-panel">
        <h3>🏆 中獎名單紀錄</h3>
        <ul class="history-list" id="historyList">
            <!-- 中獎紀錄會動態生成在這裡 -->
        </ul>
    </div>

</div>

<script>
// 儲存目前記憶體中的名單與獎項庫
let prizeInventory = {};

// 邏輯 2：自動過濾重複名單 + 提示
function validateAndCleanNames() {
    const textarea = document.getElementById('namesInput');
    const rawNames = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== "");
    
    let uniqueNames = [];
    let duplicates = [];
    
    rawNames.forEach(name => {
        if (uniqueNames.includes(name)) {
            if (!duplicates.includes(name)) {
                duplicates.push(name);
            }
        } else {
            uniqueNames.push(name);
        }
    });
    
    // 如果有重複，跳出提示
    if (duplicates.length > 0) {
        alert(`【提示】偵測到重複名單：\n${duplicates.join('、')}\n系統已自動為您過濾。`);
    }
    
    // 將過濾後的乾淨名單放回輸入框中（實現隨時可調整）
    textarea.value = uniqueNames.join('\n');
    document.getElementById('poolCount').innerText = `目前名單人數：${uniqueNames.length} 人`;
}

// 增加獎項輸入欄位
function addPrizeRow() {
    const container = document.getElementById('prizeSetupContainer');
    const row = document.createElement('div');
    row.className = 'prize-input-row';
    row.innerHTML = `
        <input type="text" class="prize-name" placeholder="獎項名稱" style="flex: 2;">
        <input type="number" class="prize-qty" placeholder="數量" style="flex: 1;" min="1" value="1">
    `;
    container.appendChild(row);
}

// 將設定的獎項同步到下拉選單中
function refreshPrizeSelect() {
    const names = document.querySelectorAll('.prize-name');
    const qtys = document.querySelectorAll('.prize-qty');
    const select = document.getElementById('prizeSelect');
    
    // 清空舊選單與舊庫存
    select.innerHTML = '';
    prizeInventory = {};
    
    let hasValidPrize = false;
    
    names.forEach((node, index) => {
        const pName = node.value.trim();
        const pQty = parseInt(qtys[index].value) || 0;
        
        if (pName !== "" && pQty > 0) {
            prizeInventory[pName] = pQty;
            
            const opt = document.createElement('option');
            opt.value = pName;
            opt.innerText = `${pName} (剩餘 ${pQty} 個)`;
            select.appendChild(opt);
            hasValidPrize = true;
        }
    });
    
    if (!hasValidPrize) {
        select.innerHTML = '<option value="">-- 尚未設定有效獎項 --</option>';
        alert("請至少填寫一個獎項名稱與數量！");
    }
}

// 核心抽獎功能
function startDraw() {
    const textarea = document.getElementById('namesInput');
    const select = document.getElementById('prizeSelect');
    const drawBtn = document.getElementById('drawBtn');
    
    // 先做一次最新的名單清理
    validateAndCleanNames();
    
    // 重新撈取最新的名單陣列（實現隨時可調整名單）
    let currentPool = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== "");
    
    if (currentPool.length === 0) {
        alert("名單是空的，請先輸入名單！");
        return;
    }
    
    // 檢查有沒有選獎項
    const selectedPrize = select.value;
    if (!selectedPrize || !prizeInventory[selectedPrize] || prizeInventory[selectedPrize] <= 0) {
        alert("請選擇一個還有剩餘數量的有效獎項！");
        return;
    }
    
    // 鎖定按鈕跑動畫
    drawBtn.disabled = true;
    
    let counter = 0;
    const interval = setInterval(() => {
        const tempIndex = Math.floor(Math.random() * currentPool.length);
        document.getElementById('result').innerText = `🎲 ${currentPool[tempIndex]}`;
        counter++;
        
        if (counter > 15) {
            clearInterval(interval);
            
            // 隨機決定中獎者
            const winnerIndex = Math.floor(Math.random() * currentPool.length);
            const winner = currentPool[winnerIndex];
            
            // 邏輯 3：扣除獎項數量
            prizeInventory[selectedPrize]--;
            
            // 邏輯 2：將中獎者從抽獎名單移除
            currentPool.splice(winnerIndex, 1);
            textarea.value = currentPool.join('\n'); // 寫回輸入框
            document.getElementById('poolCount').innerText = `目前名單人數：${currentPool.length} 人`;
            
            // 顯示當前中獎結果
            document.getElementById('result').innerHTML = `🎉 恭喜中獎：<span style="color:#db4455">${winner}</span>`;
            
            // 邏輯 4：將紀錄更新在右邊，顯示「中什麼獎」
            const historyList = document.getElementById('historyList');
            const li = document.createElement('li');
            li.innerHTML = `<span class="prize-tag">${selectedPrize}</span> <span class="winner-name">${winner}</span>`;
            historyList.insertBefore(li, historyList.firstChild); // 最新中獎顯示在最上面
            
            // 更新下拉選單中的殘餘數量顯示
            updateSelectDisplay();
            
            // 解鎖按鈕
            drawBtn.disabled = false;
        }
    }, 100);
}

// 抽完獎後，只更新選單上的文字，不破壞目前的庫存狀態
function updateSelectDisplay() {
    const select = document.getElementById('prizeSelect');
    const currentSelected = select.value;
    
    select.innerHTML = '';
    for (let prize in prizeInventory) {
        if (prizeInventory[prize] >= 0) { // 即使是 0 也顯示，方便得知抽完了
            const opt = document.createElement('option');
            opt.value = prize;
            opt.innerText = `${prize} (剩餘 ${prizeInventory[prize]} 個)`;
            if (prize === currentSelected) opt.selected = true;
            select.appendChild(opt);
        }
    }
}

// 網頁載入時初始化一次人數與選單
window.onload = function() {
    validateAndCleanNames();
    refreshPrizeSelect();
};
</script>

</body>
</html>
