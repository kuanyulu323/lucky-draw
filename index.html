// allowSpecial=false on re-draws triggered by fake decree to prevent infinite loop
function runBatchDraw(remaining, allowSpecial = true) {
    if (remaining === 0) {
        setDrawingState(false);
        resetStageTimer = setTimeout(resetStage, 5000);
        return;
    }

    const names = [...new Set(getNames())];
    if (!names.length) {
        setDrawingState(false);
        showToast('名單是空的！');
        return;
    }
    const poolOk = selectedPrize && prizeInventory[selectedPrize] > 0;
    if (!poolOk) {
        setDrawingState(false);
        showToast('此獎項已全數抽完！');
        return;
    }

    const winnerIdx = Math.floor(Math.random() * names.length);
    const winner = names[winnerIdx];
    // Special effects controlled by pendingSpecialEvent (set via Ctrl+K).
    // allowSpecial is false after a fake-decree re-draw to prevent infinite loop.
    const specialEvent = allowSpecial ? pendingSpecialEvent : null;
    if (allowSpecial) pendingSpecialEvent = null;
    const fakeDecree = specialEvent === 'fakeDecree';
    const intercept  = specialEvent === 'intercept' && names.length >= 2;
    const decoyIdx = intercept
        ? (() => {
            const others = names.map((_, i) => i).filter(i => i !== winnerIdx);
            return others[Math.floor(Math.random() * others.length)];
          })()
        : -1;
    const decoy = intercept ? names[decoyIdx] : null;

    runSlotMachine(names, winner, decoy, () => {
        if (fakeDecree) {
            showDecreeThenRedraw(winner, () => {
                runBatchDraw(remaining, false); // disable special effects for this re-draw
            });
        } else {
            finalizeWinner(names, winnerIdx, winner, decoy, () => {
                setTimeout(() => runBatchDraw(remaining - 1), quickMode ? 500 : 2000);
            });
        }
    });
}

// ─── Slot Machine ─────────────────────────────────────────────
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function runSlotMachine(names, winner, decoy, onComplete) {
    if (quickMode) {
        onComplete();
        return;
    }

    const ITEM_H = 72;
    const MACHINE_H = 360;
    const CENTER_Y = MACHINE_H / 2 - ITEM_H / 2;
    const stopTarget = decoy || winner; // slot visually stops here; decoy if intercept

    // Generator: each cycle is independently re-shuffled so names don't
    // repeat in a fixed pattern. Cycle boundaries are checked to avoid
    // having the same name at the end of one cycle and start of the next.
    function makeGen() {
        if (names.length === 1) return () => names[0];
        let cycle = shuffle([...names]);
        let pos = 0;
        return function next(last) {
            while (true) {
                if (pos >= cycle.length) {
                    let attempts = 0;
                    do { cycle = shuffle([...names]); attempts++; }
                    while (cycle[0] === last && attempts < 8);
                    pos = 0;
                }
                const c = cycle[pos++];
                if (c !== last) return c;
            }
        };
    }

    const gen = makeGen();
    const minItems = 55;
    const rounds = Math.max(4, Math.ceil(minItems / names.length));
    const seq = [];

    const totalMain = rounds * names.length;
    for (let i = 0; i < totalMain; i++) seq.push(gen(seq[seq.length - 1]));

    // Bridge: ensure item just before stopTarget is not identical
    if (names.length > 1 && seq[seq.length - 1] === stopTarget) {
        seq.push(gen(seq[seq.length - 1]));
    }

    const winnerAt = seq.length;
    seq.push(stopTarget); // stop visually on decoy (or real winner if no intercept)

    const tail = 4 + Math.floor(Math.random() * 5);
    for (let i = 0; i < tail; i++) seq.push(gen(seq[seq.length - 1]));

    const strip = document.getElementById('slotStrip');
    strip.style.transition = '';
    strip.style.transform = `translateY(${CENTER_Y}px)`;
    strip.innerHTML = seq.map(n => `<div class="slot-item">${esc(n)}</div>`).join('');

    document.getElementById('slotReady').style.display = 'none';
    document.getElementById('winnerDisplay').style.display = 'none';
    strip.style.display = 'block';

    let idx = 0;
    let speed = 38;
    let lastTime = 0;

    function step(timestamp) {
        if (timestamp - lastTime < speed) {
            requestAnimationFrame(step);
            return;
        }
        lastTime = timestamp;
        strip.style.transform = `translateY(${CENTER_Y - idx * ITEM_H}px)`;

        if (idx >= winnerAt) {
            const winY = CENTER_Y - winnerAt * ITEM_H;
            setTimeout(() => {
                strip.style.transition = 'transform 0.13s ease-out';
                strip.style.transform = `translateY(${winY - 9}px)`;
                setTimeout(() => {
                    strip.style.transform = `translateY(${winY + 3}px)`;
                    setTimeout(() => {
                        strip.style.transform = `translateY(${winY}px)`;
                        setTimeout(() => {
                            strip.style.transition = '';
                            strip.style.display = 'none';
                            onComplete();
                        }, 280);
                    }, 130);
                }, 160);
            }, 180);
            return;
        }

        idx++;
        const progress = idx / winnerAt;
        speed = progress < 0.65
            ? 38
            : 38 + Math.pow((progress - 0.65) / 0.35, 2.6) * 560;

        requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
}

function showDecreeThenRedraw(winner, onRedraw) {
    // Display winner fully — as if they actually won
    const wd  = document.getElementById('winnerDisplay');
    const txt = document.getElementById('winnerNameText');
    const ta  = document.getElementById('namesInput');

    document.getElementById('slotReady').style.display = 'none';
    document.getElementById('slotStrip').style.display = 'none';
    wd.querySelectorAll('.sword-slash').forEach(el => el.remove());
    document.getElementById('particles').innerHTML = '';
    document.getElementById('winnerPrizeReveal').innerHTML = '';
    wd.style.display = 'flex';

    txt.style.animation = 'none';
    txt.classList.remove('decoy');
    txt.textContent = winner;
    void txt.offsetHeight;
    txt.style.animation = '';
    spawnParticles();

    // ── Simulate normal draw completion: unlock page + enable button ──
    // Audience sees button become active (looks like draw really finished)
    unlockPage();
    document.getElementById('drawBtn').disabled = false;
    // isDrawing stays true so Space/Enter cannot re-trigger startDraw

    // ── Pretend it was a real win: add to history, remove name, decrement prize ──
    // Temporary history entry (not saved to localStorage)
    const tempPrize = selectedPrize || '—';
    const tempEntry = { prize: tempPrize, winner, ts: Date.now(), _fakeDecree: true };
    historyData.unshift(tempEntry);
    renderHistory();

    const allNames = getNames();
    let removedName = null;
    if (autoRemove) {
        // Use indexOf(winner) so the correct entry is removed even if the textarea
        // still has duplicates during the dedup debounce window.
        const rawIdx = allNames.indexOf(winner);
        if (rawIdx !== -1) allNames.splice(rawIdx, 1);
        removedName = winner;
        ta.value = allNames.join('\n');
        updateNameCount(ta.value);
    }

    // Decrement prize display temporarily
    // Save selectedPrize now — syncPrizeTabs() clears it when count hits 0
    const savedSelectedPrize = selectedPrize;
    let decrementedPrize = null;
    if (selectedPrize && prizeInventory[selectedPrize] > 0) {
        decrementedPrize = selectedPrize;
        prizeInventory[decrementedPrize]--;
        syncPrizeRowQty(decrementedPrize);
        syncPrizeTabs(); // may clear selectedPrize if count→0; that's fine visually
    }

    // 3~5 second pause — let chat celebrate
    const pause = 3000 + Math.random() * 2000;
    setTimeout(() => {
        // Re-lock page when stamp appears (prevent misclick during animation)
        lockPage();
        document.getElementById('drawBtn').disabled = true;

        // Stamp slams in
        const stamp = document.createElement('div');
        stamp.className = 'fake-stamp';
        stamp.innerHTML = `
            <div class="fake-stamp-kanji">作廢</div>
            <div class="fake-stamp-sub">重新抽選</div>
        `;
        wd.appendChild(stamp);

        // After stamp settles: restore name + prize, then reset and re-draw
        setTimeout(() => {
            stamp.classList.add('fading');
            setTimeout(() => {
                stamp.remove();

                // Restore history entry
                const hIdx = historyData.indexOf(tempEntry);
                if (hIdx !== -1) historyData.splice(hIdx, 1);
                renderHistory();

                // Restore name
                if (removedName !== null) {
                    const current = getNames();
                    current.push(removedName);
                    ta.value = current.join('\n');
                    updateNameCount(ta.value);
                }

                // Restore prize count
                if (decrementedPrize !== null) {
                    prizeInventory[decrementedPrize]++;
                    syncPrizeRowQty(decrementedPrize);
                    // Restore selectedPrize before syncPrizeTabs so it isn't cleared again
                    selectedPrize = savedSelectedPrize;
                    syncPrizeTabs();
                }

                // 清理殘留 DOM，但不顯示「靜候抽獎」
                // (runSlotMachine / revealWinner 自行處理畫面轉換)
                document.getElementById('slotStrip').style.display = 'none';
                document.getElementById('winnerPrizeReveal').innerHTML = '';
                document.getElementById('particles').innerHTML = '';
                document.getElementById('winnerDisplay').querySelectorAll('.sword-slash').forEach(el => el.remove());
                if (typeof onRedraw === 'function') onRedraw();
            }, 500);
        }, 1800);
    }, pause);
}

function revealWinner(winner, decoy, prize, onRealShown) {
    const wd = document.getElementById('winnerDisplay');
    const txt = document.getElementById('winnerNameText');
    const extra = document.getElementById('winnerPrizeReveal');

    document.getElementById('slotReady').style.display = 'none';
    document.getElementById('slotStrip').style.display = 'none';
    wd.querySelectorAll('.sword-slash').forEach(el => el.remove());
    document.getElementById('particles').innerHTML = '';
    extra.innerHTML = '';
    wd.style.display = 'flex';

    const showRealWinner = () => {
        txt.style.animation = 'none';
        txt.classList.remove('decoy');
        txt.textContent = winner;
        void txt.offsetHeight;
        txt.style.animation = '';
        extra.innerHTML = prize
            ? `<div class="winner-label" style="font-size:15px;letter-spacing:4px">🎁 ${esc(prize)}</div>`
            : '';
        spawnParticles();
        // Now safe to show history and save
        if (typeof onRealShown === 'function') onRealShown();
    };

    txt.style.animation = 'none';
    txt.textContent = decoy || winner;
    txt.classList.remove('decoy'); // always start as normal winner style
    void txt.offsetHeight;
    txt.style.animation = '';

    if (decoy) {
        setTimeout(() => {
            // Sword appears → simultaneously turn decoy red to signal "intercepted!"
            txt.classList.add('decoy');
            const slash = document.createElement('div');
            slash.className = 'sword-slash';
            slash.textContent = '⚔';
            wd.appendChild(slash);
            setTimeout(() => {
                slash.remove();
                showRealWinner();
            }, 500);
        }, 1400);
        return;
    }

    showRealWinner();
}

function finalizeWinner(names, winnerIdx, winner, decoy, onFinished) {
    saveSnapshot();

    const ta = document.getElementById('namesInput');
    const prize = selectedPrize;

    if (autoRemove) {
        names.splice(winnerIdx, 1);
        ta.value = names.join('\n');
        updateNameCount(ta.value);
    }

    prizeInventory[prize]--;
    syncPrizeRowQty(prize);
    if (prizeInventory[prize] <= 0) selectedPrize = '';
    syncPrizeTabs();

    revealWinner(winner, decoy, prize, () => {
        pushHistory(prize, winner);
        clearTimeout(saveCacheTimer);
        saveCache();
        checkAllDone();
        if (typeof onFinished === 'function') onFinished();
    });
}

function checkAllDone() {
    if (Object.keys(prizeInventory).length === 0) return;
    if (Object.values(prizeInventory).every(q => q <= 0)) {
        showToast('🎉 恭喜！所有獎項已全數抽完！');
    }
}

function spawnParticles() {
    const container = document.getElementById('particles');
    container.innerHTML = '';
    const colors = ['#f0c060', '#c9973a', '#ffffff', '#d42a3a', '#ff99aa', '#fff7cc'];
    for (let i = 0; i < 28; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 110;
        p.style.cssText = `
            background: ${colors[i % colors.length]};
            left: 50%; top: 50%;
            margin: -3.5px 0 0 -3.5px;
            --dx: ${(Math.cos(angle) * dist).toFixed(1)}px;
            --dy: ${(Math.sin(angle) * dist).toFixed(1)}px;
            animation-delay: ${(Math.random() * 0.15).toFixed(2)}s;
        `;
        p.addEventListener('animationend', () => p.remove(), { once: true });
        container.appendChild(p);
    }
}

// ─── Undo / Redo ──────────────────────────────────────────────
function currentSnapshot() {
    return {
        names: document.getElementById('namesInput').value,
        prizeRows: collectPrizeRows(),
        selectedPrize,
        historyData: JSON.parse(JSON.stringify(historyData))
    };
}

function saveSnapshot() {
    undoStack.push(currentSnapshot());
    if (undoStack.length > 20) undoStack.shift();
    redoStack = [];
    updateUndoRedoBtns();
}

function restoreSnapshot(snap) {
    clearTimeout(syncTabsTimer);
    const ta = document.getElementById('namesInput');
    ta.value = snap.names;
    updateNameCount(ta.value);

    const rows = document.getElementById('prizeRows');
    rows.innerHTML = '';
    (snap.prizeRows.length ? snap.prizeRows : [{ name: '', qty: 1 }]).forEach(row => {
        addPrizeRow(row.name, row.qty);
    });

    historyData = JSON.parse(JSON.stringify(snap.historyData || []));
    selectedPrize = snap.selectedPrize || '';

    resetStage();
    syncPrizeTabs();
    renderHistory();
    clearTimeout(saveCacheTimer);
    saveCache();
    updateUndoRedoBtns();
}

function undoLastDraw() {
    if (!undoStack.length || isDrawing) return;
    redoStack.push(currentSnapshot());
    if (redoStack.length > 20) redoStack.shift();
    restoreSnapshot(undoStack.pop());
    showToast('已復原');
}

function redoLastDraw() {
    if (!redoStack.length || isDrawing) return;
    undoStack.push(currentSnapshot());
    if (undoStack.length > 20) undoStack.shift();
    restoreSnapshot(redoStack.pop());
    showToast('已重做');
}

function updateUndoRedoBtns() {
    document.getElementById('undoBtn').disabled = isDrawing || undoStack.length === 0;
    document.getElementById('redoBtn').disabled = isDrawing || redoStack.length === 0;
}

// ─── View State ───────────────────────────────────────────────
function lockPage()   { document.getElementById('pageLock').classList.add('locked'); }
function unlockPage() { document.getElementById('pageLock').classList.remove('locked'); }

function setDrawingState(active) {
    isDrawing = active;
    document.getElementById('drawBtn').disabled = active;
    document.getElementById('batchInput').disabled = active;
    if (active) {
        clearTimeout(resetStageTimer);
        lockPage();
    } else {
        unlockPage();
    }
    updateUndoRedoBtns();
}

function resetStage() {
    document.getElementById('slotReady').style.display = 'flex';
    document.getElementById('slotStrip').style.display = 'none';
    document.getElementById('winnerDisplay').style.display = 'none';
    document.getElementById('winnerPrizeReveal').innerHTML = '';
    document.getElementById('particles').innerHTML = '';
    document.getElementById('winnerDisplay').querySelectorAll('.sword-slash').forEach(el => el.remove());
}

// ─── Util ────────────────────────────────────────────────────
function clamp(num, min, max) {
    return Math.min(max, Math.max(min, num));
}

function esc(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

// ── Cache ──────────────────────────────────────────────────────
function loadBBCache() {
    try {
        const raw = localStorage.getItem(BB_CACHE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && typeof data === 'object') {
            blindBox.enabled       = !!data.enabled;
            blindBox.locked        = !!data.locked;
            blindBox.checkedPrizes = Array.isArray(data.checkedPrizes) ? data.checkedPrizes : [];
            blindBox.exclusives    = Array.isArray(data.exclusives)
                ? data.exclusives.filter(e => e && typeof e.name === 'string' && e.name.trim())
                : [];
        }
    } catch (_) {}
}

function saveBBCache() {
    localStorage.setItem(BB_CACHE_KEY, JSON.stringify(blindBox));
}

// ── Pool helpers ───────────────────────────────────────────────
function buildBBWeightedPool() {
    const pool = [];
    blindBox.checkedPrizes.forEach(name => {
        const qty = prizeInventory[name] || 0;
        for (let i = 0; i < qty; i++) pool.push(name);
    });
    blindBox.exclusives.forEach(ex => {
        const qty = Math.max(0, Number(ex.qty) || 0);
        for (let i = 0; i < qty; i++) pool.push(ex.name);
    });
    return pool;
}

function getBBPrizeTypes() {
    const types = [];
    const seen  = new Set();
    blindBox.checkedPrizes.forEach(name => {
        if (!seen.has(name) && (prizeInventory[name] || 0) > 0) {
            types.push(name); seen.add(name);
        }
    });
    blindBox.exclusives.forEach(ex => {
        if (ex.name && !seen.has(ex.name) && (Number(ex.qty) || 0) > 0) {
            types.push(ex.name); seen.add(ex.name);
        }
    });
    return types;
}

// ── Sidebar UI ────────────────────────────────────────────────

    const section = document.getElementById('bbSection');
    if (!section) return;
    section.innerHTML = '';

    // ── Disabled ──
    if (!blindBox.enabled) {
        section.innerHTML = `
            <div style="margin-bottom:0">
                <div class="sec-lbl" style="margin-bottom:6px">🎲 神秘盲盒</div>

            blindBox.enabled = e.target.checked;
            saveBBCache(); renderBBSection(); syncPrizeTabs();

                <button class="bb-lock-btn" id="bbLockBtn">🔒 確認鎖定盲盒配置</button>
            </div>
        </div>`;

    // ── Event listeners ──
    section.querySelector('#bbToggle').addEventListener('change', e => {
        if (!e.target.checked) {
            blindBox.enabled = false; blindBox.locked = false;
            if (selectedPrize === BLIND_BOX_PRIZE_ID) selectedPrize = '';
            saveBBCache(); renderBBSection(); syncPrizeTabs();
        }
    });

    section.querySelectorAll('.bb-prize-check').forEach(cb => {
        cb.addEventListener('change', () => {
            blindBox.checkedPrizes = Array.from(section.querySelectorAll('.bb-prize-check:checked'))
                .map(c => c.dataset.prize);
            saveBBCache();
        });
    });

    section.querySelector('#bbAddExclBtn').addEventListener('click', () => {
        collectBBExclusives();
        blindBox.exclusives.push({ name: '', qty: 1 });
        saveBBCache(); renderBBSection();
    });

    section.querySelector('#bbExclRows').addEventListener('click', e => {
        const del = e.target.closest('.bb-excl-del');
        if (!del) return;
        const row = del.closest('.bb-excl-row');
        collectBBExclusives();
        blindBox.exclusives.splice(Number(row.dataset.idx), 1);
        saveBBCache(); renderBBSection();
    });

    section.querySelector('#bbExclRows').addEventListener('input', e => {
        if (e.target.matches('.bb-excl-name, .bb-excl-qty')) {
            collectBBExclusives(); saveBBCache();
        }
    });

    section.querySelector('#bbLockBtn').addEventListener('click', confirmBBConfig);
}

function collectBBExclusives() {
    const rows = document.querySelectorAll('.bb-excl-row');
    blindBox.exclusives = [];
    rows.forEach(row => {
        const name = row.querySelector('.bb-excl-name').value.trim();
        const qty  = parseInt(row.querySelector('.bb-excl-qty').value, 10) || 1;
        if (name) blindBox.exclusives.push({ name, qty });
    });
}

function updateBBCheckedList() {
    // Called by syncPrizeTabs() to keep the checkbox list in sync when prizes change.
    if (!blindBox.enabled || blindBox.locked) return;
    const listEl = document.getElementById('bbCheckedList');
    if (!listEl) return;
    const currentPrizes = Object.keys(prizeInventory);
    blindBox.checkedPrizes = blindBox.checkedPrizes.filter(n => currentPrizes.includes(n));
    listEl.innerHTML = currentPrizes.length
        ? currentPrizes.map(name => `
            <label class="bb-checked-item">
                <input type="checkbox" class="bb-prize-check" data-prize="${esc(name)}"
                    ${blindBox.checkedPrizes.includes(name) ? 'checked' : ''}>
                <span>${esc(name)}&nbsp;<small style="opacity:.6">×${prizeInventory[name]}</small></span>
            </label>`).join('')
        : '<div style="font-size:11px;color:var(--text-sub);padding:4px">尚無正常獎項</div>';

    listEl.querySelectorAll('.bb-prize-check').forEach(cb => {
        cb.addEventListener('change', () => {
            blindBox.checkedPrizes = Array.from(listEl.querySelectorAll('.bb-prize-check:checked'))
                .map(c => c.dataset.prize);
            saveBBCache();
        });
    });
}

function confirmBBConfig() {
    collectBBExclusives();
    blindBox.checkedPrizes = Array.from(document.querySelectorAll('.bb-prize-check:checked'))
        .map(c => c.dataset.prize);

    const types = getBBPrizeTypes();
    if (types.length < 1) { showToast('請至少設定一種盲盒獎品！'); return; }
    const pool  = buildBBWeightedPool();
    if (pool.length < 1) { showToast('盲盒獎池為空，請確認獎項數量！'); return; }

    blindBox.locked = true;
    saveBBCache(); renderBBSection(); syncPrizeTabs();
    showToast(`🎁 神秘盲盒已鎖定！共 ${types.length} 種、${pool.length} 抽`);
}

// ── Blind Box Draw Orchestration ──────────────────────────────
function startBBDraw() {
    const names = [...new Set(getNames())];
    const pool  = buildBBWeightedPool();
    const types = getBBPrizeTypes();
    if (!names.length)  { showToast('名單是空的！');       return; }
    if (!pool.length)   { showToast('盲盒獎池已全數抽完！'); return; }
    if (!types.length)  { showToast('盲盒無可用獎品種類！'); return; }

    // ── Pre-determine winner's prize (the "magic trick" moment) ──
    const prizeIdx  = Math.floor(Math.random() * pool.length);
    bbWinnerPrize   = pool[prizeIdx];

    // ── Draw winner from name pool ──
    const winnerIdx = Math.floor(Math.random() * names.length);
    bbWinnerName    = names[winnerIdx];
    bbPhase         = 'drawing';

    setDrawingState(true);

    // Run slot machine (no intercept, no fake decree during blind box)
    runSlotMachine(names, bbWinnerName, null, () => {
        revealBBWinnerBrief(bbWinnerName, () => {
            openBBModal(bbWinnerName, bbWinnerPrize, types, names, winnerIdx);
        });
    });
}

function revealBBWinnerBrief(winner, onDone) {
    const wd    = document.getElementById('winnerDisplay');
    const txt   = document.getElementById('winnerNameText');
    const extra = document.getElementById('winnerPrizeReveal');

    document.getElementById('slotReady').style.display = 'none';
    document.getElementById('slotStrip').style.display = 'none';
    wd.querySelectorAll('.sword-slash').forEach(el => el.remove());
    document.getElementById('particles').innerHTML = '';
    extra.innerHTML = '';
    wd.style.display = 'flex';

    txt.style.animation = 'none';
    txt.classList.remove('decoy');
    txt.textContent = winner;
    void txt.offsetHeight;
    txt.style.animation = '';
    extra.innerHTML = `<div class="winner-label" style="font-size:15px;letter-spacing:4px">🎁 神秘盲盒 ???</div>`;
    spawnParticles();

    // Brief pause so audience sees the winner, then modal takes over
    setTimeout(onDone, quickMode ? 600 : 1800);
}

// ── Modal ─────────────────────────────────────────────────────
function openBBModal(winnerName, winnerPrize, types, names, winnerIdx) {
    bbPhase         = 'awaiting_flip';
    bbClickedTablet = -1;
    bbTabletAssign  = [];

    // Build tablet assignments:
    //   One tablet is the winner's pre-determined prize.
    //   All other tablets carry the remaining prize types (shuffled).
    //   No matter which tablet the winner picks, we show their pre-determined prize
    //   on that tablet and fill the rest normally — the magic trick.
    const winnerTabletPos = Math.floor(Math.random() * types.length);
    const otherTypes      = shuffle(types.filter(t => t !== winnerPrize));

    let otherIdx = 0;
    for (let i = 0; i < types.length; i++) {
        if (i === winnerTabletPos) {
            bbTabletAssign.push({ prize: winnerPrize, isPresetWinner: true });
        } else {
            const prize = otherTypes[otherIdx] !== undefined ? otherTypes[otherIdx] : winnerPrize;
            otherIdx++;
            bbTabletAssign.push({ prize, isPresetWinner: false });
        }
    }

    // Set winner name display
    document.getElementById('bbWinnerNameDisplay').textContent = winnerName;

    // Render tablets
    const grid = document.getElementById('bbTabletsGrid');
    grid.innerHTML = '';
    bbTabletAssign.forEach((_, i) => {
        const tablet = document.createElement('div');
        tablet.className = 'bb-tablet';
        tablet.id = `bb-tablet-${i}`;
        tablet.innerHTML = `
            <div class="bb-tablet-inner">
                <div class="bb-tablet-front">
                    <div class="bb-tablet-kanji">令</div>
                    <div class="bb-tablet-ques">???</div>
                </div>
                <div class="bb-tablet-back" id="bb-back-${i}">
                    <!-- filled on flip -->
                </div>
            </div>`;
        tablet.addEventListener('click', () => handleBBTabletClick(i));
        grid.appendChild(tablet);
    });

    // Reset action bar
    document.getElementById('bbActionBar').style.display = 'none';
    document.getElementById('bbRevealedPrizeName').textContent = '';

    // Show modal + unlock page so host can interact with tablets
    document.getElementById('bbModal').style.display = 'flex';

    // Keep drawBtn disabled (isDrawing = true) so keyboard shortcuts can't trigger new draw
    // but unlock the page-level pointer-events lock so modal is clickable
    unlockPage();

    // Anti-spoiler: defer name removal + history write until finalizeBBDraw()
    // Store winnerIdx for later use
    document.getElementById('bbModal').dataset.winnerIdx = winnerIdx;
}

function handleBBTabletClick(idx) {
    if (bbPhase !== 'awaiting_flip') return;
    if (bbClickedTablet !== -1) return; // already flipped one

    bbClickedTablet = idx;
    bbPhase         = 'flipping';

    // ── Always show winner's pre-determined prize on the chosen tablet ──
    // (Regardless of which position was internally preset as the winner's.)
    // Remap assignments so clicked tablet carries winner's prize.
    const presetPos = bbTabletAssign.findIndex(a => a.isPresetWinner);
    if (presetPos !== idx) {
        // Swap prizes: the originally preset winner tablet gets what the clicked tablet had
        const swapPrize = bbTabletAssign[idx].prize;
        bbTabletAssign[idx]       = { prize: bbWinnerPrize, isPresetWinner: true };
        bbTabletAssign[presetPos] = { prize: swapPrize, isPresetWinner: false };
    }

    // Populate + flip clicked tablet (winner's prize, crimson glow)
    const backEl = document.getElementById(`bb-back-${idx}`);
    backEl.classList.add('winner-back');
    backEl.innerHTML = `
        <div class="bb-prize-icon">⭐</div>
        <div class="bb-prize-name">${esc(bbWinnerPrize)}</div>
        <div class="bb-winner-mark">✦ 中獎 ✦</div>`;

    const tabletEl = document.getElementById(`bb-tablet-${idx}`);
    tabletEl.classList.add('flipped');
    spawnBBParticles(tabletEl);

    // Flip remaining tablets one-by-one after a short delay
    setTimeout(() => revealOtherBBTablets(idx), 1100);
}

function spawnBBParticles(refEl) {
    const rect   = refEl.getBoundingClientRect();
    const cx     = rect.left + rect.width  / 2;
    const cy     = rect.top  + rect.height / 2;
    const colors = ['#f0c060','#c9973a','#ffffff','#d42a3a','#ff99aa','#fff7cc'];
    for (let i = 0; i < 22; i++) {
        const p     = document.createElement('div');
        const angle = Math.random() * Math.PI * 2;
        const dist  = 40 + Math.random() * 90;
        p.style.cssText = `
            position:fixed; width:7px; height:7px; border-radius:50%;
            background:${colors[i % colors.length]};
            left:${cx}px; top:${cy}px;
            margin:-3.5px 0 0 -3.5px;
            --dx:${(Math.cos(angle)*dist).toFixed(1)}px;
            --dy:${(Math.sin(angle)*dist).toFixed(1)}px;
            animation:burst .85s ease-out ${(Math.random()*.12).toFixed(2)}s forwards;
            z-index:9999; pointer-events:none;`;
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove(), { once: true });
    }
}

function revealOtherBBTablets(clickedIdx) {
    const tablets = document.querySelectorAll('.bb-tablet');
    let delay = 0;

    tablets.forEach((tab, i) => {
        if (i === clickedIdx) return;
        const assignment = bbTabletAssign[i];
        const backEl = document.getElementById(`bb-back-${i}`);
        backEl.classList.remove('winner-back');
        backEl.innerHTML = `
            <div class="bb-prize-icon">🎁</div>
            <div class="bb-prize-name">${esc(assignment.prize)}</div>`;
        setTimeout(() => tab.classList.add('flipped'), delay);
        delay += 220;
    });

    // Show confirm button after all tablets have flipped
    setTimeout(() => {
        bbPhase = 'revealed';
        document.getElementById('bbRevealedPrizeName').textContent = bbWinnerPrize;
        document.getElementById('bbActionBar').style.display = 'flex';
    }, delay + 500);
}

// ── Finalize (anti-spoiler: runs ONLY after host confirms) ────
function finalizeBBDraw() {
    if (bbPhase !== 'revealed') return;

    saveSnapshot();

    const winnerIdx = parseInt(document.getElementById('bbModal').dataset.winnerIdx || '-1', 10);

    // 1. Remove winner from names pool (anti-spoiler: deferred until now)
    if (autoRemove && winnerIdx !== -1) {
        const ta    = document.getElementById('namesInput');
        const names = getNames();
        if (winnerIdx < names.length) names.splice(winnerIdx, 1);
        ta.value = names.join('\n');
        updateNameCount(ta.value);
    }

    // 2. Decrement inventory (anti-spoiler: deferred until now)
    const isNormalPrize = blindBox.checkedPrizes.includes(bbWinnerPrize);
    const exEntry       = blindBox.exclusives.find(e => e.name === bbWinnerPrize);

    if (isNormalPrize && Object.hasOwn(prizeInventory, bbWinnerPrize)) {
        prizeInventory[bbWinnerPrize] = Math.max(0, prizeInventory[bbWinnerPrize] - 1);
        syncPrizeRowQty(bbWinnerPrize);
    } else if (exEntry) {
        exEntry.qty = Math.max(0, exEntry.qty - 1);
        saveBBCache();
    }

    // 3. Write to history (anti-spoiler: deferred until now)
    historyData.unshift({
        prize:    bbWinnerPrize,
        realPrize: bbWinnerPrize,
        winner:   bbWinnerName,
        blindBox: true,
        ts:       Date.now(),
    });
    renderHistory();

    // 4. Sync tabs + persist
    syncPrizeTabs();
    clearTimeout(saveCacheTimer);
    saveCache();
    checkAllDone();

    // 5. Close modal and reset
    closeBBModal();
}

function closeBBModal() {
    document.getElementById('bbModal').style.display = 'none';
    bbPhase         = 'idle';
    bbWinnerName    = null;
    bbWinnerPrize   = null;
    bbTabletAssign  = [];
    bbClickedTablet = -1;
    setDrawingState(false);
    resetStageTimer = setTimeout(resetStage, 3000);
}

})();
</script>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="pageLock"></div>

<!-- ═══════════════ Blind Box Modal ═══════════════ -->
<div id="bbModal" class="bb-modal" style="display:none" role="dialog" aria-modal="true" aria-label="神秘盲盒開獎">
    <div class="bb-modal-inner">
        <div class="bb-top-line"></div>
        <div class="bb-announce">
            <div class="bb-announce-label">🎁 神秘盲盒開獎</div>
            <div class="bb-announce-winner" id="bbWinnerNameDisplay"></div>
            <div class="bb-announce-sub">請選擇一塊令牌，以揭曉命運之獎</div>
        </div>
        <div class="bb-tablets-grid" id="bbTabletsGrid"></div>
        <div class="bb-action-bar" id="bbActionBar" style="display:none">
            <div class="bb-result-line">✨ 恭喜獲得：<strong id="bbRevealedPrizeName"></strong></div>
            <button class="bb-confirm-draw-btn" id="bbConfirmDrawBtn">確認中獎，記錄入冊</button>
            <div class="bb-hint-line">點擊按鈕後，中獎記錄將正式寫入右側名單</div>
        </div>
    </div>
</div>
